[build-system]
requires = [
    "setuptools>=83.0.0",
    "wheel>=0.47.0",
]
build-backend = "setuptools.build_meta"

[project]
name = "decider"
version = "3.4.1"
description = ""
requires-python = ">=3.12"
authors = [
    { name = "Helmut Konrad Schewe", email = "helmutus@outlook.com" },
]
dependencies = [
    "utilo>=2.101.0,<3.0.0",
    "protocol>=3.20.1,<4.0.0",
    "iamraw>=4.88.13,<5.0.0",
    "detector>=0.40.1,<1.0.0",
    "words>=1.23.3,<2.0.0",
    "texas>=0.15.2,<1.0.0",
    "groupme>=0.40.5,<1.0.0",
    "smarty>=1.6.2,<2.0.0",
    "configo>=0.25.4,<1.0.0",
    "german>=1.28.1,<2.0.0",
    "konrad>=0.10.3,<1.0.0",
    "linkify>=0.4.1,<1.0.0",
    "elements>=0.21.7,<1.0.0",
]
keywords = []
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
license = "MIT"
license-files = [
    "LICENSE",
]

[project.readme]
file = "README"
content-type = "text/markdown"

[project.optional-dependencies]
dev = [
    "writers>=1.6.1,<2.0.0",
    "utilatest==0.26.1",
    "genex==0.37.1",
    "genref==1.3.12",
    "power==2.20.1",
    "jam==0.5.5",
    "decider_con==0.12.0",
    "lists>=0.3.3,<1.0.0",
    "footnote>=0.2.6,<1.0.0",
]

[project.urls]
Homepage = "https://github.com/anaticulae/decider"
Repository = "https://github.com/anaticulae/decider"

[project.scripts]
decider = "decider.cli:main"
decider_fonts = "fonts.cli:main"
decider_footnote = "decider_footnote.cli:main"
decider_imgfig = "decider_imgfig.cli:main"

[tool.semantic_release]
version_toml = [
    "pyproject.toml:project.version",
]

[tool.semantic_release.changelog]
mode = "init"
output_format = "md"

[tool.semantic_release.changelog.default_templates]
changelog_file = "CHANGELOG"

[tool.semantic_release.commit_parser_options]
patch_tags = [
    "build",
    "chore",
    "ci",
    "deps",
    "docs",
    "fix",
    "perf",
    "refactor",
    "style",
    "test",
]
minor_tags = [
    "feat",
]

[tool.setuptools.packages.find]
where = [
    ".",
]
include = [
    "decider",
    "decider.features",
    "decider.links",
    "decider_footnote",
    "decider_footnote.features",
    "decider_footnote.rules",
    "decider_imgfig",
    "decider_imgfig.features",
    "fonts",
    "fonts.features",
]
exclude = [
    "tests*",
]

[tool.hoverpower]
packages = [
    "BACHELOR",
    "BOOK",
    "DISS",
    "DOCU",
    "HOME",
    "MASTER",
    "TECH",
]
