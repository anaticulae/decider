[build-system]
requires = [
    "setuptools>=84.0.0",
    "wheel>=0.48.0",
]
build-backend = "setuptools.build_meta"

[project]
name = "decider-main"
version = "3.4.3"
description = ""
requires-python = ">=3.12"
authors = [
    { name = "Helmut Konrad Schewe", email = "helmutus@outlook.com" },
]
dependencies = [
    "callidus>=1.7.1,<2.0.0",
    "configos>=1.0.4,<2.0.0",
    "elementae>=1.0.1,<2.0.0",
    "germania>=1.33.1,<2.0.0",
    "groupmes>=1.1.3,<2.0.0",
    "iamraw>=4.95.1,<5.0.0",
    "indagator>=1.0.2,<2.0.0",
    "konradus>=1.0.1,<2.0.0",
    "ligare>=1.0.0,<2.0.0",
    "protoerror>=3.20.4,<4.0.0",
    "texes>=1.0.1,<2.0.0",
    "utilo>=2.112.1,<3.0.0",
    "verbo>=1.23.4,<2.0.0",
]
keywords = []
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
license = "MIT"
license-files = [
    "LICENSE",
]

[project.readme]
file = "README"
content-type = "text/markdown"

[project.optional-dependencies]
dev = [
    "decider-con>=1.0.1,<2.0.0",
    "gennex==1.1.0",
    "genref==1.4.4",
    "hoverpower==1.7.0",
    "ibidem>=1.0.2,<2.0.0",
    "indicibus>=1.0.2,<2.0.0",
    "jamer==1.0.2",
    "utilotest==1.1.1",
    "writers>=1.7.1,<2.0.0",
]

[project.urls]
Homepage = "https://github.com/anaticulae/decider"
Repository = "https://github.com/anaticulae/decider"

[project.scripts]
decider = "decider.cli:main"
decider_fonts = "fonts.cli:main"
decider_footnote = "decider_footnote.cli:main"
decider_imgfig = "decider_imgfig.cli:main"

[tool.semantic_release]
version_toml = [
    "pyproject.toml:project.version",
]

[tool.semantic_release.changelog]
mode = "init"
output_format = "md"

[tool.semantic_release.changelog.default_templates]
changelog_file = "CHANGELOG"

[tool.semantic_release.commit_parser_options]
patch_tags = [
    "build",
    "chore",
    "ci",
    "deps",
    "docs",
    "fix",
    "perf",
    "refactor",
    "style",
    "test",
]
minor_tags = [
    "feat",
]

[tool.setuptools.packages.find]
where = [
    ".",
]
include = [
    "decider",
    "decider.features",
    "decider.links",
    "decider_footnote",
    "decider_footnote.features",
    "decider_footnote.rules",
    "decider_imgfig",
    "decider_imgfig.features",
    "fonts",
    "fonts.features",
]
exclude = [
    "tests*",
]

[tool.hoverpower]
packages = [
    "BACHELOR",
    "BOOK",
    "DISS",
    "DOCU",
    "HOME",
    "MASTER",
    "TECH",
]
